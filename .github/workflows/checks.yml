# Checks (AGENTS.md, docs/ARCHITECTURE.md): `npm run check` on every push to dev and master: scope, words, links, ui,
# owners (against the commit before the push), the type check and the unit tests. Read-only token, no secrets, builds
# and publishes nothing. GitHub Actions on the main account has been locked over billing since 2026-10-25
# (docs/ops/hosting.md, "Building on a PC"). This workflow is not part of the gate until a person has seen its first
# green run; until then the pre-push hook (.githooks/pre-push) is the gate.
name: Checks

on:
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund --loglevel=error
      # The commit before the push is the owners base. On the first push of a branch (github.event.before is forty
      # zeros) or a manual run (empty) the commit before HEAD is used instead; origin/dev is a base either way.
      - name: Base for check:owners
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            echo "OWNERS_BASE=$BEFORE" >> "$GITHUB_ENV"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            echo "OWNERS_BASE=HEAD~1" >> "$GITHUB_ENV"
          fi
      - run: npm run check
