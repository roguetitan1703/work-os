# nginx site for Work OS at work.delpat.in (docs/hosting.md). Install as /etc/nginx/sites-available/work-os and link it
# into sites-enabled. The certificate comes from certbot first (docs/hosting.md step 5); certbot renews it on its own.
# The app listens on 127.0.0.1:3000 only (deploy/systemd/work-os.service); nginx is the only way in.

# WebSocket upgrade: "Connection: upgrade" only when the client asked for one (the push channel, docs/hosting.md "Push").
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Sign-in endpoints: a modest per-address limit in front of Better Auth's own limits (docs/auth.md). 30 a minute
# with a burst of 20 covers page loads that ask for the session; scripted guessing gets 429.
limit_req_zone $binary_remote_addr zone=work_os_auth:10m rate=30r/m;
limit_req_status 429;

server_tokens off;

upstream work_os {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Anything that is not work.delpat.in (scanners hitting the bare IP): drop the connection.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# TLS to the bare IP or another name: refuse the handshake (no certificate is shown).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name work.delpat.in;
    # certbot's HTTP-01 renewals are answered by the certbot nginx plugin; everything else goes to https.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name work.delpat.in;

    ssl_certificate     /etc/letsencrypt/live/work.delpat.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/work.delpat.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Server actions and MCP calls are small; note files go straight to blob storage (app/api/notes/upload).
    # 10 MB leaves room for a large pasted note.
    client_max_body_size 10m;

    location / {
        proxy_pass http://work_os;
        proxy_http_version 1.1;

        # Who the client is. The app trusts these only with TRUST_PROXY=1 (lib/auth.ts clientIp): X-Real-IP first,
        # else the right-most X-Forwarded-For. Both are overwritten here, so a client cannot choose its own address.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket upgrade (push).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming: pages stream (Suspense) and MCP answers with server-sent events; buffering would hold them back.
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/auth/ {
        limit_req zone=work_os_auth burst=20 nodelay;
        proxy_pass http://work_os;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # The alert cron is called on localhost:3000 by work-os-alerts.timer, never through nginx.
    location /api/cron/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://work_os;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # Liveness: no log line every probe.
    location = /api/live {
        proxy_pass http://work_os;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }
}
