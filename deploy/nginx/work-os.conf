# nginx site for Work OS at work.delpat.in (docs/hosting.md). Install as /etc/nginx/sites-available/work-os and link it
# into sites-enabled (Amazon Linux: /etc/nginx/conf.d/work-os.conf). The certificate comes from certbot first
# (docs/hosting.md step 5); certbot renews it on its own.
# The app listens on 127.0.0.1 only (deploy/systemd/work-os.service); nginx is the only way in.
#
# The server is shared with other apps, so this file only ADDS: two server blocks for work.delpat.in and names that
# start with work_os (map variable, limit zones, upstream). It sets no default_server and no http-level directive
# that would change other sites (limit_*_status and server_tokens are set inside our server blocks). Dropping
# connections to unknown names and the bare IP is a separate, opt-in file: work-os-default-deny.conf.
#
# App port: 3000 by default. If WORK_OS_PORT in /etc/work-os/env says otherwise, change the upstream below to match.

# WebSocket upgrade: "Connection: upgrade" only when the client asked for one. Push turned out to be Server-Sent
# Events (docs/hosting.md "Push"), which needs no upgrade; this stays harmless for anything that does ask.
# Named work_os_* because many sites define the usual $connection_upgrade map and nginx refuses a duplicate variable.
map $http_upgrade $work_os_connection_upgrade {
    default upgrade;
    ''      close;
}

# Sign-in endpoints: a modest per-address limit in front of Better Auth's own limits (docs/auth.md). 30 a minute
# with a burst of 20 covers page loads that ask for the session; scripted guessing gets 429.
limit_req_zone $binary_remote_addr zone=work_os_auth:10m rate=30r/m;

# Push streams (docs/hosting.md "Push"): each holds a connection for up to 30 minutes, so cap how many one address
# holds at once and how fast it opens them. The app also caps them per person and per computer (lib/live.ts).
limit_conn_zone $binary_remote_addr zone=work_os_stream_conn:10m;
limit_req_zone  $binary_remote_addr zone=work_os_stream_req:10m rate=30r/m;

upstream work_os {
    # = WORK_OS_PORT (default 3000)
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name work.delpat.in;
    server_tokens off;
    # certbot's HTTP-01 renewals are answered by the certbot nginx plugin; everything else goes to https.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... http2" works on nginx 1.18-1.24 (Ubuntu 22.04/24.04) and later (a deprecation warning from 1.25.1,
    # where "http2 on;" is the new form, which older versions reject). On old nginx, http2 on a 443 socket is shared
    # by every site on that socket, which browsers handle fine.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name work.delpat.in;
    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;

    ssl_certificate     /etc/letsencrypt/live/work.delpat.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/work.delpat.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Server actions and MCP calls are small; note files go straight to blob storage (app/api/notes/upload).
    # 10 MB leaves room for a large pasted note.
    client_max_body_size 10m;

    location / {
        proxy_pass http://work_os;
        proxy_http_version 1.1;

        # Who the client is. The app trusts these only with TRUST_PROXY=1 (lib/auth.ts clientIp): X-Real-IP first,
        # else the right-most X-Forwarded-For. Both are overwritten here, so a client cannot choose its own address.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket upgrade (push).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $work_os_connection_upgrade;

        # Streaming: pages stream (Suspense) and MCP answers with server-sent events; buffering would hold them back.
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/auth/ {
        limit_req zone=work_os_auth burst=20 nodelay;
        proxy_pass http://work_os;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # The alert cron is called on 127.0.0.1:WORK_OS_PORT by work-os-alerts.timer, never through nginx.
    location /api/cron/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://work_os;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # Push streams (docs/hosting.md "Push"): Server-Sent Events, held open up to 30 minutes with a comment every 25 s.
    # Pass each event on at once, never gzip them here, keep the upstream connection alive.
    location ~ ^/api/(stream|worker/stream)$ {
        # 20 open at once per address (raise it if a whole office shares one address), 30 new a minute, burst 20.
        limit_conn work_os_stream_conn 20;
        limit_req zone=work_os_stream_req burst=20 nodelay;
        proxy_pass http://work_os;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Liveness: no log line every probe.
    location = /api/live {
        proxy_pass http://work_os;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }
}
