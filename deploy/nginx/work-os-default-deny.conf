# OPT-IN, not installed by default (docs/hosting.md step 5). Drops requests for names this server does not serve and
# for the bare IP: 444 (close) on port 80, and on 443 the TLS handshake is refused, so no certificate is shown.
#
# Install it only if NO other site on this box is, or relies on being, the default server: it becomes the default for
# every app here, so any name that is not in some server_name (another app's www. alias, a health check that calls the
# IP, a load balancer probing by IP) stops being answered. deploy/preflight.sh lists the default servers and names
# already set. On a shared box ask whoever runs the other apps first; if one of them already has a default_server,
# leave this out (nginx refuses two default servers on one port).
#
# Needs nginx 1.19.4+ (ssl_reject_handshake).
#   sudo cp work-os-default-deny.conf /etc/nginx/sites-available/work-os-default-deny
#   sudo ln -s /etc/nginx/sites-available/work-os-default-deny /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}
